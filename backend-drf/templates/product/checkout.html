{% extends "product/base.html" %}
{% block content %}
<div class="container mx-auto p-6">
    <div class="max-w-lg mx-auto bg-white shadow-lg rounded-lg p-6">
        <h2 class="text-2xl font-semibold">Checkout - {{ product.name }}</h2>
        <p class="text-lg text-gray-600">Price: ₹{{ product.price }}</p>
        <button id="rzp-button1" class="mt-4 bg-green-500 text-white px-6 py-2 rounded-lg">Pay Now</button>
        {% csrf_token %}
    
    
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>


<script>
    document.getElementById("rzp-button1").addEventListener(
        "click" , async function(e){    
            e.preventDefault();
            let response = await fetch("{% url 'create_payment' product.id %}", {
                method:"POST", 
            })
            let data = await response.json()
            var options = {
                "key": data.razorpay_key_id, // Enter the Key ID generated from the Dashboard
                "amount": data.amount, // Amount is in currency subunits. 
                "currency": "INR",
                "name": "DentMedHub", //your business name
                "description": "Test Transaction",
                "image": "https://example.com/your_logo",
                "order_id": data.order_id, // This is a sample Order ID. Pass the `id` obtained in the response of Step 1
                "callback_url": data.razorpay_callback_url,
                "prefill": { //We recommend using the prefill parameter to auto-fill customer's contact information especially their phone number
                    "name": "<test_name>", //your customer's name
                    "email": "<test_email>",
                    "contact": "<test_phone>" //Provide the customer's phone number for better conversion rates 
                },
                "notes": {
                    "address": "DentMedHub Corporate Office"
                },
                "theme": {
                    "color": "#3399cc"
                }
            };

            var rzp1 = new Razorpay(options); 
            rzp1.open();
            e.preventDefault();

        }
    )
</script>

{% endblock %}
